{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Recuperar contraseña</title>
	<link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body class="login-page">
	<main class="login-card account-card">
		<a class="logo-link" href="http://127.0.0.1:8000/usuario/" aria-label="Ir a mi espacio"><img class="login-logo" src="{% static 'img/recorteCircular_FlyNote.png' %}" alt="Logo de Diario de viajes"></a>
		<h1>Recuperar contraseña</h1>
		<p class="login-subtitle">Escribe tu nombre de usuario o correo electrónico.</p>

		{% if mensaje %}
			<p class="login-success" role="status">{{ mensaje }}</p>
		{% endif %}

		<form method="post" class="login-form">
			{% csrf_token %}
			<label for="identificador">Nombre de usuario o correo</label>
			<input type="text" id="identificador" name="identificador" autocomplete="username" required>
			<button type="submit">Continuar</button>
		</form>

		<p class="account-link"><a class="back-to-trips-button" href="{% url 'inicio' %}">Volver a iniciar sesión</a></p>
	</main>
</body>
</html>
