{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Iniciar sesión</title>
	<link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body class="login-page">
	<main class="login-card">
		<a class="logo-link" href="http://127.0.0.1:8000/usuario/" aria-label="Ir a mi espacio"><img class="login-logo" src="{% static 'img/recorteCircular_FlyNote.png' %}" alt="Logo de Diario de viajes"></a>
		<h1>Iniciar sesión</h1>
		<p class="login-subtitle">Una forma de compartir tus experiencias de viaje.</p>

		{% if error %}
			<p class="login-error" role="alert">{{ error }}</p>
		{% endif %}

		<form method="post" class="login-form">
			{% csrf_token %}
			<label for="identificador">Usuario o correo</label>
			<input type="text" id="identificador" name="identificador" autocomplete="username" required>

			<div class="password-label">
				<label for="password">Contraseña</label>
				<button type="button" class="password-toggle" data-password-targets="password" aria-pressed="false" aria-label="Mostrar contraseña">Mostrar</button>
			</div>
			<div class="password-field">
				<input type="password" id="password" name="password" autocomplete="current-password" required>
			</div>

			<button type="submit">Iniciar sesión</button>
		</form>
		<p class="account-link"><a class="create-account-link" href="{% url 'crear_cuenta' %}">Crear cuenta</a></p>
		<p class="account-link password-recovery-link"><a class="password-recovery-button" href="{% url 'recuperar_contraseña' %}">¿Olvidaste la contraseña?</a></p>
	</main>
	<script src="{% static 'app.js' %}"></script>
</body>
</html>
